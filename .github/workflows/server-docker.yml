name: Build Production Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "server/**"
      - "docs/PRIVACY_POLICY.md"
      - "deploy/privacy/**"
      - ".github/workflows/server-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SERVER_IMAGE_NAME: bikegogogo-server
  PRIVACY_IMAGE_NAME: bikegogogo-privacy

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bikegogogo_test
          POSTGRES_USER: bikegogogo
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikegogogo -d bikegogogo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bikegogogo:integration-test-password@127.0.0.1:5432/bikegogogo_test
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    name: Build and push production images
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/${owner}/${SERVER_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "privacy=ghcr.io/${owner}/${PRIVACY_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract server Docker metadata
        id: server_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.server }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.server_meta.outputs.tags }}
          labels: ${{ steps.server_meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Extract privacy Docker metadata
        id: privacy_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.privacy }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push privacy policy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/privacy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.privacy_meta.outputs.tags }}
          labels: ${{ steps.privacy_meta.outputs.labels }}
          cache-from: type=gha,scope=privacy
          cache-to: type=gha,mode=max,scope=privacy
