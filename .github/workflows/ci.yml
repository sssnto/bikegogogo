name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-mirror:
    name: iOS source mirror consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify mirrored iOS sources
        run: diff -qr BikeGoGo/BikeGoGo Apps/iOS/BikeGoGo --exclude=.DS_Store

  swift:
    name: Swift package tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build Swift package
        run: swift build

      - name: Test Swift package
        run: swift test

  ios-release:
    name: iOS and Watch release build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release app for Simulator
        run: >-
          xcodebuild
          -project BikeGoGo/BikeGoGo.xcodeproj
          -scheme BikeGoGo
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/BikeGoGoDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Check release binary for forbidden APIs
        run: >-
          scripts/check_forbidden_apis.sh
          "$RUNNER_TEMP/BikeGoGoDerivedData/Build/Products/Release-iphonesimulator/BikeGoGo.app"

  server:
    name: Server typecheck and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bikegogogo_test
          POSTGRES_USER: bikegogogo
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikegogogo -d bikegogogo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bikegogogo:integration-test-password@127.0.0.1:5432/bikegogogo_test

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  admin:
    name: Admin typecheck, tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bikegogogo_admin_test
          POSTGRES_USER: bikegogogo
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikegogogo -d bikegogogo_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bikegogogo:integration-test-password@127.0.0.1:5432/bikegogogo_admin_test

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
