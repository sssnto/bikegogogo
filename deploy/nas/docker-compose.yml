services:
  privacy-policy:
    image: ghcr.io/sssnto/bikegogogo-privacy:latest
    container_name: bikegogogo-privacy
    restart: unless-stopped
    ports:
      - "${BIKEGOGO_PRIVACY_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  bikegogogo-server:
    image: ghcr.io/sssnto/bikegogogo-server:latest
    container_name: bikegogogo-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIKEGOGOGO_HTTP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      LIVEKIT_URL: "${LIVEKIT_URL}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      DATA_FILE: "/data/bikegogogo.json"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bikegogogo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/nas/.env}@postgres:5432/${POSTGRES_DB:-bikegogogo}"
      APPLE_BUNDLE_ID: "${APPLE_BUNDLE_ID:-com.sssnto.BikeGoGo}"
      APPLE_SIGN_IN_KEY_ID: "${APPLE_SIGN_IN_KEY_ID:?set APPLE_SIGN_IN_KEY_ID in deploy/nas/.env}"
      APPLE_SIGN_IN_TEAM_ID: "${APPLE_SIGN_IN_TEAM_ID:?set APPLE_SIGN_IN_TEAM_ID in deploy/nas/.env}"
      APPLE_SIGN_IN_CLIENT_ID: "${APPLE_SIGN_IN_CLIENT_ID:-com.sssnto.BikeGoGo}"
      APPLE_SIGN_IN_KEY_PATH: "/run/secrets/apple-sign-in-key.p8"
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-30}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-1}"
      ANALYTICS_HMAC_SECRET: "${ANALYTICS_HMAC_SECRET:?set ANALYTICS_HMAC_SECRET in deploy/nas/.env}"
      APNS_KEY_ID: "${APNS_KEY_ID:?set APNS_KEY_ID in deploy/nas/.env}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:?set APNS_TEAM_ID in deploy/nas/.env}"
      APNS_TOPIC: "${APNS_TOPIC:-com.sssnto.BikeGoGo}"
      APNS_ENVIRONMENT: "${APNS_ENVIRONMENT:-sandbox}"
      APNS_KEY_PATH: "/run/secrets/AuthKey_${APNS_KEY_ID:?set APNS_KEY_ID in deploy/nas/.env}.p8"
      APNS_PRODUCTION_KEY_ID: "${APNS_PRODUCTION_KEY_ID:-}"
      APNS_PRODUCTION_KEY_PATH: "/run/secrets/apns-production-key.p8"
    volumes:
      - bikegogogo-data:/data
      - "./secrets:/run/secrets:ro"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  bikegogogo-admin:
    image: ghcr.io/sssnto/bikegogogo-admin:latest
    container_name: bikegogogo-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bikegogogo-server:
        condition: service_healthy
    ports:
      - "${BIKEGOGOGO_ADMIN_PORT:-8082}:8082"
    environment:
      NODE_ENV: production
      PORT: "8082"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bikegogogo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/nas/.env}@postgres:5432/${POSTGRES_DB:-bikegogogo}"
      ADMIN_ENCRYPTION_SECRET: "${ADMIN_ENCRYPTION_SECRET:?set ADMIN_ENCRYPTION_SECRET in deploy/nas/.env}"
      ADMIN_INITIAL_USERNAME: "${ADMIN_INITIAL_USERNAME:-}"
      ADMIN_INITIAL_PASSWORD_HASH: "${ADMIN_INITIAL_PASSWORD_HASH:-}"
      ADMIN_INITIAL_TOTP_SECRET: "${ADMIN_INITIAL_TOTP_SECRET:-}"
      ADMIN_COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-1}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8082/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    container_name: bikegogogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bikegogogo}"
      POSTGRES_USER: "${POSTGRES_USER:-bikegogogo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/nas/.env}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - bikegogogo-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

volumes:
  bikegogogo-data:
  bikegogogo-postgres:
